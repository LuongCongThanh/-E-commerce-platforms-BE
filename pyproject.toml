[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-backend"
version = "0.1.0"
description = "E-commerce platform backend using Django and DRF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0.4",
    "djangorestframework>=3.15.1",
    "django-environ>=0.11.2",
    "psycopg2-binary>=2.9.9",
    "djangorestframework-simplejwt>=5.3.1",
    "django-cors-headers>=4.3.1",
    "drf-spectacular>=0.27.2",
    "django-filter>=24.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.ruff]
line-length = 88
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 88
