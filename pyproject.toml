[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-backend"
version = "0.1.0"
description = "E-commerce platform backend using Django and DRF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0.4",
    "djangorestframework>=3.15.1",
    "django-environ>=0.11.2",
    "psycopg2-binary>=2.9.9",
    "djangorestframework-simplejwt>=5.3.1",
    "django-cors-headers>=4.3.1",
    "drf-spectacular>=0.27.2",
    "django-filter>=24.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
addopts = "--cov=apps --cov-report=term-missing --no-cov-on-fail -q"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.ruff]
line-length = 88
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.black]
line-length = 88
